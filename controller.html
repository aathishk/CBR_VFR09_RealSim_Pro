<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#03070d"><title>CBR VFR Phone Controller</title><style>:root{--c:#7bd7ff;--g:#62ffac;--a:#ffd164;--bg:#03070d;--m:#6f899e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none}html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:#eff9ff;font-family:system-ui,sans-serif}main{height:100%;padding:8px;display:grid;grid-template-rows:auto 1fr auto auto auto;gap:7px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font:800 11px monospace;letter-spacing:.12em}.status{font:800 9px monospace;border:1px solid #244454;border-radius:999px;padding:5px 8px;color:var(--a)}.status.ok{color:var(--g);border-color:#286149}.horizon{position:relative;min-height:0;border:1px solid #214050;border-radius:14px;overflow:hidden;background:linear-gradient(#113750 0 50%,#171d1d 50%)}.horizon:before{content:'';position:absolute;left:-35%;right:-35%;top:50%;height:2px;background:var(--c)}.horizon:after{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:#7bd7ff55}.plane{position:absolute;left:50%;top:50%;width:120px;height:4px;border-radius:4px;background:var(--a);transform:translate(-50%,-50%)}.plane:after{content:'';position:absolute;left:50%;top:-28px;width:4px;height:56px;background:var(--a);transform:translateX(-50%)}.reads{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.read{border:1px solid #183241;border-radius:10px;padding:7px;text-align:center}.read small{display:block;color:var(--m);font:8px monospace}.read b{font:800 15px monospace}.control{border:1px solid #183241;border-radius:10px;padding:7px}.control label{display:flex;justify-content:space-between;font:9px monospace;color:var(--m)}input{width:100%;accent-color:var(--c)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn,.boost{min-height:48px;border-radius:10px;border:1px solid var(--c);background:transparent;color:var(--c);font-weight:900}.boost{min-height:56px;border-color:var(--a);color:var(--a)}.btn:active,.boost:active{background:#7bd7ff18}@media(min-width:760px){main{max-width:920px;margin:auto;grid-template-columns:1.5fr 1fr;grid-template-rows:auto 1fr auto auto auto}.top{grid-column:1/-1}.horizon{grid-row:2/6}.reads,.control,.actions,.boost{grid-column:2}}</style></head><body><main><div class="top"><div class="brand">CBR // VFR-09 PHONE FLIGHT CONTROLLER</div><div id="status" class="status">CONNECTING</div></div><div class="horizon"><div class="plane"></div></div><div class="reads"><div class="read"><small>PITCH</small><b id="p">0.0°</b></div><div class="read"><small>ROLL</small><b id="r">0.0°</b></div><div class="read"><small>YAW</small><b id="y">0.0°</b></div></div><div class="control"><label><span>THROTTLE</span><b id="tv">65%</b></label><input id="thr" type="range" min="0" max="100" value="65"></div><div class="actions"><button id="gyro" class="btn">ENABLE GYRO</button><button id="cal" class="btn">CALIBRATE</button></div><button id="boost" class="boost">BOOST</button></main><script>
let ws=null,attached=false,raw={a:0,b:0,g:0},neutral={a:0,b:0,g:0},boost=false;const $=id=>document.getElementById(id);function fs(){document.documentElement.requestFullscreen?.().catch(()=>{});screen.orientation?.lock?.('landscape').catch(()=>{});}function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(proto+'://'+location.hostname+':3001');ws.onopen=()=>{$('status').textContent='LINKED';$('status').className='status ok'};ws.onclose=()=>{$('status').textContent='OFFLINE';$('status').className='status';setTimeout(connect,1000)}}function send(type='phone-data'){if(!ws||ws.readyState!==1)return;ws.send(JSON.stringify({type,pitch:raw.b,roll:raw.g,yaw:raw.a,throttle:+$('thr').value/100,boost,calibration:type==='phone-calibrate'?{pitch:raw.b,roll:raw.g,yaw:raw.a}:undefined}))}function render(){const pd=raw.b-neutral.b,rd=raw.g-neutral.g,yd=((raw.a-neutral.a+540)%360)-180;$('p').textContent=pd.toFixed(1)+'°';$('r').textContent=rd.toFixed(1)+'°';$('y').textContent=yd.toFixed(1)+'°'}async function enable(){fs();try{if(typeof DeviceOrientationEvent==='undefined')throw new Error();if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')throw new Error();if(!attached){addEventListener('deviceorientation',e=>{raw={a:Number.isFinite(e.alpha)?e.alpha:raw.a,b:Number.isFinite(e.beta)?e.beta:raw.b,g:Number.isFinite(e.gamma)?e.gamma:raw.g};render();send()},true);attached=true}$('gyro').textContent='GYRO ON'}catch{alert('Motion permission was denied or is unavailable.')}}$('gyro').onclick=enable;$('cal').onclick=()=>{neutral={...raw};render();send('phone-calibrate');fs()};$('thr').oninput=()=>{$('tv').textContent=$('thr').value+'%';send()};$('boost').onpointerdown=()=>{boost=true;send()};$('boost').onpointerup=$('boost').onpointercancel=()=>{boost=false;send()};connect();
</script></body></html>
